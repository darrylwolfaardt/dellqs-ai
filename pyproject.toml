[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qs-agents"
version = "1.0.0"
description = "Quantity Surveying AI Agent Framework"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "Dell QS", email = "info@dellqs.co.za"}
]
keywords = ["quantity-surveying", "construction", "ai", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "PyMuPDF>=1.23.0",
    "anthropic>=0.18.0",
    "openai>=1.10.0",
    "aiohttp>=3.9.0",
    "httpx>=0.26.0",
    "pydantic>=2.5.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
qs-agents = "qs_agents.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["qs_agents*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
